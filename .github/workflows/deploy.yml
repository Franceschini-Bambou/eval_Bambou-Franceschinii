name: CI/CD WebClients

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Vérification du build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build

  deploy:
    name: Déploiement sur le VPS
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd /var/www/webclients
            git pull origin main
            ~/.bun/bin/bun install
            ~/.bun/bin/bun run build
            sudo systemctl restart webclients
            sleep 3
            curl -fsS -o /dev/null http://127.0.0.1:3344 && echo "Déploiement OK"